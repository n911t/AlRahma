<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>تطبيقات وخدمات شركة الرحمة</title>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 font-sans">

    <!-- الهيدر والباركود العام -->
    <div class="max-w-md mx-auto text-center py-6">
        <h1 class="text-xl font-bold">تطبيقات وخدمات</h1>
        <h2 class="text-2xl text-blue-400 font-bold mt-1">شركة الرحمة للانترنت الضوئي</h2>
        
        <!-- باركود الصفحة الكاملة -->
        <div class="mt-6 bg-white p-2 rounded-2xl inline-block shadow-xl shadow-blue-900/20">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=رابط_موقعك_هنا" class="w-40 h-40">
        </div>
        <p class="text-xs text-gray-500 mt-2">امسح الباركود لمشاركة الصفحة كاملة</p>
    </div>

    <!-- المحتوى -->
    <div class="max-w-md mx-auto space-y-4 pb-10">
        
        <!-- قائمة التطبيقات بالترتيب المصحح -->
        <div class="grid gap-3">
            <a href="https://vodu.me" class="block bg-gray-900 border border-gray-800 p-5 rounded-2xl hover:border-blue-500 transition text-center font-bold">تطبيق فودو (Vodu)</a>
            <a href="https://updates.cee.buzz/public/APK/CEE.apk" class="block bg-gray-900 border border-gray-800 p-5 rounded-2xl hover:border-blue-500 transition text-center font-bold">تطبيق CEE</a>
            
            <!-- تم تبديل الترتيب هنا -->
            <a href="https://drive.google.com/file/d/1Uk1QWyCZfkJ5Btu1n5RX1CxSlCTcwPA-/view" class="block bg-gray-900 border border-gray-800 p-5 rounded-2xl hover:border-blue-500 transition text-center font-bold">سينمانا</a>
            <a href="https://drive.google.com/file/d/1Jw1UL_zp6ukCHMZyljslPBb-VseOi-CI/view" class="block bg-gray-900 border border-gray-800 p-5 rounded-2xl hover:border-blue-500 transition text-center font-bold">دراما لايف</a>
            <a href="https://drive.google.com/file/d/18JG7mEEM2IrBLWg1Vy9RbXmV1h0n9LcH/view" class="block bg-gray-900 border border-gray-800 p-5 rounded-2xl hover:border-blue-500 transition text-center font-bold">دراما ويف</a>
            <a href="https://drive.google.com/file/d/1fF1Yc3l4WbwrjkLV4JW_nZBLMRyY0dSP/view" class="block bg-gray-900 border border-gray-800 p-5 rounded-2xl hover:border-blue-500 transition text-center font-bold">ياسين TV</a>
        </div>

        <!-- قسم الخدمات والمباريات -->
        <div class="grid grid-cols-2 gap-3 pt-4">
            <a href="https://tv.kooraiq.com" class="bg-indigo-900 border border-indigo-700 p-4 rounded-xl text-center font-bold">باقة الرياضة</a>
            <a href="https://selfcare.rahmatele.com/" class="bg-emerald-900 border border-emerald-700 p-4 rounded-xl text-center font-bold">تجديد الاشتراك</a>
        </div>
    </div>

</body>
</html>
