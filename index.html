<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقات وخدمات الرحمة</title>
    <!-- استدعاء خط "Cairo" من جوجل لتجربة قراءة ممتازة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-color: #f0f4f8; /* خلفية فاتحة ومريحة */
            --text-color: #1a1a1a;
            --primary-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); /* تدرج أزرق حيوي */
            --secondary-gradient: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%); /* تدرج وردي فاتح للمشاركة */
            --btn-bg: #ffffff;
            --btn-shadow: 10px 10px 20px #d1d9e6, -10px -10px 20px #ffffff; /* تأثير النيومورفيزم */
            --btn-shadow-active: inset 5px 5px 10px #d1d9e6, inset -5px -5px 10px #ffffff; /* تأثير الضغط */
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-h: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px; /* أنسب عرض لشاشات الموبايل */
            padding: 30px 15px;
            box-sizing: border-box;
        }

        /* تنسيق الهيدر */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-weight: 900;
            font-size: 24px;
            margin: 0;
            color: #0072ff;
        }

        header h2 {
            font-weight: 700;
            font-size: 18px;
            margin: 5px 0 0 0;
            opacity: 0.8;
        }

        /* تنسيق زر الباركود المخفي */
        .share-container {
            text-align: center;
            margin-bottom: 25px;
        }

        #shareBtn {
            background: var(--secondary-gradient);
            border: none;
            color: #1a1a1a;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(250, 208, 196, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #shareBtn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(250, 208, 196, 0.4);
        }

        #qrContainer {
            display: none; /* مخفي افتراضياً */
            margin-top: 20px;
            background: rgb(255, 255, 255);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        #qrContainer img {
            max-width: 150px;
            border: 5px solid #f0f4f8;
            border-radius: 10px;
        }

        /* تنسيق شبكة التطبيقات */
        .app-grid {
            display: grid;
            gap: 15px;
        }

        .app-card {
            background-color: var(--btn-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: var(--btn-shadow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .app-card:active {
            box-shadow: var(--btn-shadow-active);
            transform: scale(0.98);
        }

        /* الأيقونات الحيوية داخل الكروت */
        .app-icon {
            font-size: 24px;
            width: 50px;
            h: 50px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 15px;
            box-shadow: 0 5px 10px rgba(0, 114, 255, 0.3);
        }

        .app-name {
            font-weight: 700;
            font-size: 16px;
        }

        /* كرت الخدمات (الرياضة وتجديد الاشتراك) */
        .service-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .service-card {
            background-color: var(--btn-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            box-shadow: var(--btn-shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .service-card:active {
            box-shadow: var(--btn-shadow-active);
        }

        .service-card i {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .service-card.sports {
            background: linear-gradient(135deg, #ffd831 0%, #ff9a00 100%); /* ذهبي للرياضة */
            color: white;
        }

        .service-card.sports i {
            color: white;
        }

        .service-card.sports .service-name {
            font-weight: 700;
            color: white;
        }

        .service-card.renew {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); /* أخضر للتجديد */
            color: white;
        }

        .service-card.renew i {
            color: white;
        }

        .service-card.renew .service-name {
            font-weight: 700;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر -->
        <header>
            <h1>تطبيقات وخدمات</h1>
            <h2>شركة الرحمة للانترنت الضوئي</h2>
        </header>

        <!-- قسم مشاركة الصفحة -->
        <div class="share-container">
            <button id="shareBtn"><i class="fas fa-qrcode"></i> مشاركة الصفحة</button>
            <div id="qrContainer">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://n911t.github.io/AlRahma/" alt="الباركود العام">
                <p style="font-size: 10px; color: #1a1a1a; margin-top: 10px;">امسح لمشاركة رابط الصفحة</p>
            </div>
        </div>

        <!-- شبكة التطبيقات (بالترتيب المصحح) -->
        <div class="app-grid">
            <a href="https://vodu.me" class="app-card">
                <div class="app-icon"><i class="fas fa-video"></i></div>
                <div class="app-name">تطبيق فودو (Vodu)</div>
            </a>
            <a href="https://share.vodu.store/#/" class="app-card">
                <div class="app-icon"><i class="fas fa-share-alt"></i></div>
                <div class="app-name">فودو شير (Vodu Share)</div>
            </a>
            <a href="https://updates.cee.buzz/public/APK/CEE.apk" class="app-card">
                <div class="app-icon"><i class="fas fa-satellite-dish"></i></div>
                <div class="app-name">تطبيق CEE</div>
            </a>
            <a href="https://drive.google.com/file/d/1Uk1QWyCZfkJ5Btu1n5RX1CxSlCTcwPA-/view" class="app-card">
                <div class="app-icon"><i class="fas fa-film"></i></div>
                <div class="app-name">سينمانا</div>
            </a>
            <a href="https://drive.google.com/file/d/1Jw1UL_zp6ukCHMZyljslPBb-VseOi-CI/view" class="app-card">
                <div class="app-icon"><i class="fas fa-tv"></i></div>
                <div class="app-name">دراما لايف</div>
            </a>
            <a href="https://drive.google.com/file/d/18JG7mEEM2IrBLWg1Vy9RbXmV1h0n9LcH/view" class="app-card">
                <div class="app-icon"><i class="fas fa-wave-square"></i></div>
                <div class="app-name">دراما ويف</div>
            </a>
            <a href="https://drive.google.com/file/d/1fF1Yc3l4WbwrjkLV4JW_nZBLMRyY0dSP/view" class="app-card">
                <div class="app-icon"><i class="fas fa-mobile-alt"></i></div>
                <div class="app-name">ياسين TV</div>
            </a>
        </div>

        <!-- شبكة الخدمات والمباريات -->
        <div class="service-grid">
            <a href="https://tv.kooraiq.com" class="service-card sports">
                <i class="fas fa-running sports"></i>
                <div class="service-name">باقة الرياضة</div>
            </a>
            <a href="https://selfcare.rahmatele.com/" class="service-card renew">
                <i class="fas fa-credit-card renew"></i>
                <div class="service-name">تجديد الاشتراك</div>
            </a>
        </div>
    </div>

    <!-- كود الجافا سكريبت لإظهار/إخفاء الباركود -->
    <script>
        const shareBtn = document.getElementById('shareBtn');
        const qrContainer = document.getElementById('qrContainer');

        shareBtn.addEventListener('click', function() {
            if (qrContainer.style.display === 'none' || qrContainer.style.display === '') {
                qrContainer.style.display = 'inline-block';
            } else {
                qrContainer.style.display = 'none';
            }
        });
    </script>

</body>
</html>
